<!doctype html>
<!-- Static mock of megavoice's Takes page over a fabricated store. Opens from
     disk; ?state= picks a fixture: list, empty, undelivered, recording, search,
     retrans-failed, no-herdr, loading, offline, refused, nomatch. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1512" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <title>录音历史 · megavoice</title>
    <link rel="preload" href="fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        var t = localStorage.getItem("takes.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#list">跳到录音列表</a>
    <div id="app"></div>
    <script src="fixtures.js"></script>
    <script src="app.js"></script>
  </body>
</html>
