<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1512" media="(prefers-color-scheme: dark)" />
    <title>Meetings</title>
    <script>
      try { var t = localStorage.getItem("meetings.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <script src="/client/ccc-page@1.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
